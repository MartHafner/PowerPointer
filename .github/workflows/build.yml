name: Build

on:
  push:
    tags: ['v*']        # Build bei Tags wie v2.0.1
  workflow_dispatch:     # manuell startbar

permissions:
  contents: write        # nötig, um ein Release zu erstellen

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22      # Electron 45 braucht >= 22.12
          cache: npm

      - run: npm ci
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: powerpointer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe